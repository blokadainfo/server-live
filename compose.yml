  #   volumes:
  #     - type: volume
  #       source: restreamer-conf-vol
  #       target: /core/config
  #       volume:
  #         nocopy: false
  #     - type: volume
  #       source: restreamer-data-vol
  #       target: /core/data
  #       volume:
  #         nocopy: false
  #   ports:
  #     - "1935:1935/tcp" # RTMP
  #     - "6000:6000/udp" # SRT
  #   networks:
  #     - internal
